<script type="module">
    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        addDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
        apiKey: "AIzaSyDeeMQploVOBrMyaVWQLUIgwQyVQ60ZfB0",
        authDomain: "saratec-quotation.firebaseapp.com",
        projectId: "saratec-quotation",
        storageBucket: "saratec-quotation.firebasestorage.app",
        messagingSenderId: "856410846697",
        appId: "1:856410846697:web:aa491f55abe772e006c778",
        measurementId: "G-KCK7D501KT"
    };


    // Firebase initialize
    const app = initializeApp(firebaseConfig);

    // Authentication
    const auth = getAuth(app);

    // Firestore
    const db = getFirestore(app);


    // LOGIN PROTECTION
    onAuthStateChanged(auth, (user) => {

        if (!user) {
            window.location.href = "login.html";
        }

    });


    // LOGOUT
    document.addEventListener("DOMContentLoaded", () => {

        const logoutBtn = document.getElementById("logoutBtn");

        if (logoutBtn) {

            logoutBtn.addEventListener("click", async () => {

                try {

                    await signOut(auth);

                    window.location.href = "login.html";

                } catch (error) {

                    alert("Logout failed: " + error.message);

                }

            });

        }

    });


    // SAVE QUOTATION ACTIVITY TO FIRESTORE
    window.logQuotation = async function(data, quotationNo, fileName) {

        try {

            const user = auth.currentUser;

            if (!user) {
                console.warn("User is not logged in.");
                return;
            }

            await addDoc(collection(db, "quotations"), {

                uid: user.uid,

                email: user.email,

                customer: data.customer || "",

                customerAddress: data.address || "",

                customerContact: data.contact || "",

                project: data.project || "",

                quotationNo: quotationNo,

                subtotal: Number(data.subtotal || 0),

                gstTotal: Number(data.gstTotal || 0),

                grandTotal: Number(data.grandTotal || 0),

                pdfFileName: fileName,

                createdAt: serverTimestamp()

            });

            console.log("Quotation activity saved successfully.");

        } catch (error) {

            console.error("Firestore save failed:", error);

        }

    };

</script>

/* =====================================================
   QUOTATION NUMBER
   FIX: generate ONCE and reuse everywhere (preview + PDF)
   so counter doesn't jump twice per quotation.
===================================================== */

let currentQuotationNo = null;

function getQuotationNumber(){

    if(currentQuotationNo){
        return currentQuotationNo;
    }

    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2,"0");
    const d = String(now.getDate()).padStart(2,"0");

    const key = "saratec_quote_counter";
    let counter = Number(localStorage.getItem(key) || 0) + 1;
    localStorage.setItem(key, counter);

    currentQuotationNo = `SE/${y}${m}${d}/${String(counter).padStart(3,"0")}`;
    return currentQuotationNo;
}

/* Call this when user starts a fresh quotation for a new customer
   (optional helper, not wired to any button by default) */
function resetQuotationNumber(){
    currentQuotationNo = null;
}

/* =====================================================
   SHRINK WRAPPING MACHINE TECHNICAL DETAILS
   ===================================================== */

function getMachineDetailsHTML(machine){
    const d = machine.technicalDetails;
    if(!d) return "";

    const configuration = Array.isArray(d.configuration) ? d.configuration : [];
    const constructionOptions = Array.isArray(d.constructionOptions) ? d.constructionOptions : [];
    const specifications = Array.isArray(d.specifications) ? d.specifications : [];
    const customization = Array.isArray(d.customization) ? d.customization : [];
    const changeParts = Array.isArray(d.changeParts) ? d.changeParts : [];
    const majorComponents = Array.isArray(d.majorComponents) ? d.majorComponents : [];
    const optionalEquipment = Array.isArray(d.optionalEquipment) ? d.optionalEquipment : [];

    const listSection = (title, items, ordered = false) => {
        if(!items.length) return "";
        const tag = ordered ? "ol" : "ul";
        return `
            <h4>${escapeHTML(title)}</h4>
            <${tag}>
                ${items.map(x => `<li>${escapeHTML(x)}</li>`).join("")}
            </${tag}>
        `;
    };

    const specificationRows = specifications.map(row => {
        const parameter = Array.isArray(row) ? (row[0] ?? "") : "";
        const value = Array.isArray(row) ? (row[1] ?? "") : "";
        return `
            <tr>
                <td><b>${escapeHTML(parameter)}</b></td>
                <td>${escapeHTML(value)}</td>
            </tr>
        `;
    }).join("");

    return `
        <div class="machine-detail-section">
            ${d.constructionDetails ? `<h4>Construction Details</h4><p>${escapeHTML(d.constructionDetails)}</p>` : ""}
            ${listSection("Machine Configuration", configuration, true)}
            ${listSection("Construction Options", constructionOptions)}
            ${d.operation ? `<h4>Operation</h4><p>${escapeHTML(d.operation)}</p>` : ""}

            ${specifications.length ? `
                <h4>Technical Specifications</h4>
                <table class="machine-detail-table">
                    <thead>
                        <tr><th>Parameter</th><th>Details</th></tr>
                    </thead>
                    <tbody>${specificationRows}</tbody>
                </table>
            ` : ""}

            ${listSection("Customization", customization, true)}
            ${listSection("Change Parts", changeParts)}
            ${listSection("Major Components", majorComponents)}
            ${listSection("Optional Equipment", optionalEquipment)}
            ${d.hygienicFeatures ? `<h4>Hygienic Features</h4><p>${escapeHTML(d.hygienicFeatures)}</p>` : ""}
            ${d.specialFeature ? `<h4>Special Feature</h4><p>${escapeHTML(d.specialFeature)}</p>` : ""}
            ${d.note ? `<p><b>Note:</b> ${escapeHTML(d.note)}</p>` : ""}
        </div>
    `;
}

/* =====================================================
   COLLECT FORM DATA
===================================================== */

function collectData(){

    const items = [];
    let subtotal = 0;

    // Standard machines
    document.querySelectorAll(".machine-check:checked").forEach(check => {

        const index = Number(check.dataset.index);
        const machine = machineData[index];

        const priceInput = document.querySelector(
            `.machine-price[data-index="${index}"]`
        );

        const price = Number(priceInput.value) || 0;

        const featureInput = document.querySelector(
            `.machine-feature[data-index="${index}"]`
        );

        const feature = featureInput
            ? featureInput.value.trim()
            : "";

        const gstAmount = price * machine.gst / 100;

        items.push({
            ...machine,
            price: price,
            feature: feature,
            gstAmount: gstAmount,
            total: price + gstAmount
        });

        subtotal += price;
    });

    // Dynamic Other machines
    document.querySelectorAll(".other-machine-box").forEach(box => {

        const nameInput = box.querySelector(".other-machine-name");
        const priceInput = box.querySelector(".other-machine-price");
        const specInput = box.querySelector(".other-machine-spec");
        const featureInput = box.querySelector(".other-machine-feature");
        const powerInput = box.querySelector(".other-machine-power");
        const warrantyInput = box.querySelector(".other-machine-warranty");

        const name = nameInput ? nameInput.value.trim() : "";
        const price = priceInput ? Number(priceInput.value) || 0 : 0;
        const specification = specInput
            ? specInput.value.trim()
            : "";
        const feature = featureInput
            ? featureInput.value.trim()
            : "";
        const power = powerInput
            ? powerInput.value.trim()
            : "";
        const warranty = warrantyInput
            ? warrantyInput.value.trim()
            : "";

        // Ignore a completely empty Other Machine box.
        if(!name && !price && !specification && !feature && !power){
            return;
        }

        const gst = 18;
        const gstAmount = price * gst / 100;

        items.push({
            name: name || "Other Machine",
            specification: specification || "-",
            gst: gst,
            warranty: warranty || "-",
            photo: "",
            power: power || "-",
            feature: feature || "-",
            price: price,
            gstAmount: gstAmount,
            total: price + gstAmount
        });

        subtotal += price;
    });

    /* Optional Accessories - supplied without separate charge */
    const accessories = [];

    document.querySelectorAll(".accessory-box").forEach(box => {
        const nameInput = box.querySelector(".accessory-name");
        const specInput = box.querySelector(".accessory-spec");
        const qtyInput = box.querySelector(".accessory-qty");

        const name = nameInput ? nameInput.value.trim() : "";
        const specification = specInput ? specInput.value.trim() : "";
        const qty = qtyInput ? Math.max(1, Number(qtyInput.value) || 1) : 1;

        if(!name && !specification) return;

        accessories.push({
            name: name || "Accessory",
            specification: specification || "-",
            qty: qty
        });
    });

    const gstTotal = items.reduce(
        (sum, item) => sum + item.gstAmount,
        0
    );

    return {
        customer: document.getElementById("customer").value.trim(),
        address: document.getElementById("address").value.trim(),
        contact: document.getElementById("customerContact").value.trim(),
        validity: document.getElementById("validity").value.trim(),
        project: (document.getElementById("project").value === "__OTHER__"
            ? document.getElementById("projectOther").value.trim()
            : document.getElementById("project").value),
        terms: document.getElementById("terms").value.trim(),
        items: items,
        accessories: accessories,
        accessoriesSubtotal: 0,
        accessoriesGST: 0,
        subtotal: subtotal,
        gstTotal: gstTotal,
        grandTotal: subtotal + gstTotal
    };
}

    return "Rs. " + Number(value).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* =====================================================
   LOGO LOADER (for PDF)
   Loads "saratec logo.png" from the same folder as this
   HTML file and converts it to base64 so jsPDF can embed
   it in the header (top-left) and on the profile page.
   NOTE: this must be served from a local/web server (or
   opened via Live Server) — plain double-click file://
   opening can block the fetch in some browsers.
===================================================== */

let cachedLogoData = null;
let logoLoadAttempted = false;

async function getLogoBase64(){

    if(logoLoadAttempted){
        return cachedLogoData;
    }

    logoLoadAttempted = true;

    try {
        const response = await fetch("saratec logo.png");
        if(!response.ok) throw new Error("Logo fetch failed");
        const blob = await response.blob();

        cachedLogoData = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });

    } catch(err){
        console.warn("Could not load logo for PDF:", err);
        cachedLogoData = null;
    }

    return cachedLogoData;
}

function getImageFormat(base64){
    if(base64 && base64.includes("image/png")) return "PNG";
    if(base64 && (base64.includes("image/jpeg") || base64.includes("image/jpg"))) return "JPEG";
    return "PNG";
}

const machinePhotoCache = {};

async function getMachinePhotoBase64(filename){
    if(!filename) return null;
    if(machinePhotoCache[filename] !== undefined) return machinePhotoCache[filename];
    try {
        const response = await fetch(filename);
        if(!response.ok) throw new Error("Photo fetch failed: " + filename);
        const blob = await response.blob();
        const data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
        machinePhotoCache[filename] = data;
        return data;
    } catch(err) {
        console.warn("Could not load machine photo:", filename, err);
        machinePhotoCache[filename] = null;
        return null;
    }
}

/* =====================================================
   PDF DOWNLOAD
===================================================== */

async function downloadPDF(){

    const data = collectData();

    if(!data.customer){
        alert("Please enter customer name.");
        return;
    }

    if(data.items.length === 0){
        alert("Please select at least one machine.");
        return;
    }

    if(!data.project){
        alert("Please select or enter a project name.");
        return;
    }

    const zeroPriceItem = data.items.find(item => Number(item.price) <= 0);
    if(zeroPriceItem){
        alert(`Please enter a valid price for: ${zeroPriceItem.name}`);
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("p", "mm", "a4");

    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 15;

    const quotationNo = getQuotationNumber();
    const today = new Date().toLocaleDateString("en-IN");

    const logoData = await getLogoBase64();
    const logoFormat = getImageFormat(logoData);

    for(const item of data.items){
        item.photoData = item.photo ? await getMachinePhotoBase64(item.photo) : null;
        item.photoFormat = getImageFormat(item.photoData);
    }

    /* =====================================================
       PAGE 1 - COMPANY PROFILE
    ===================================================== */

    drawCompanyProfilePage(doc, pageWidth, pageHeight, margin, logoData, logoFormat);

    /* =====================================================
       PAGE 2 - QUOTATION
    ===================================================== */

    doc.addPage();

    let y = drawPDFHeader(doc, pageWidth, margin, logoData, logoFormat);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.text("QUOTATION", pageWidth / 2, y, { align: "center" });

    y += 8;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.text(`Quotation No.: ${quotationNo}`, margin, y);
    doc.text(`Date: ${today}`, pageWidth - margin, y, { align: "right" });

    y += 8;

    drawCustomerBox(doc, data, margin, pageWidth, y);

    y += 38;

    /* =====================================================
       MACHINE TABLE
       (Power / Warranty columns removed)
       Every field now wraps within its column width instead
       of running off the page.
    ===================================================== */

    const headers = [
        "S.No",
        "Machine",
        "Feature / Capacity",
        "Price",
        "GST",
        "GST Amt.",
        "Total"
    ];

    const colX = [margin, 25, 70, 110, 135, 150, 172];
    const colW = [10, 45, 40, 25, 15, 22, 23];

    function drawTableHeader(){
        doc.setFillColor(235, 235, 235);
        doc.rect(margin, y, pageWidth - margin * 2, 8, "F");
        doc.setFont("helvetica", "bold");
        doc.setFontSize(7);
        headers.forEach((h, i) => {
            doc.text(h, colX[i] + 1, y + 5);
        });
        y += 8;
    }

    drawTableHeader();

    data.items.forEach((item, index) => {

        const specLines = doc.splitTextToSize(item.name + "\n" + item.specification, colW[1] - 2);
        const featureLines = doc.splitTextToSize(item.feature || "-", colW[2] - 2);
        const priceLines = doc.splitTextToSize(item.price.toLocaleString("en-IN"), colW[3] - 2);
        const gstLines = doc.splitTextToSize(`${item.gst}%`, colW[4] - 2);
        const gstAmtLines = doc.splitTextToSize(item.gstAmount.toLocaleString("en-IN"), colW[5] - 2);
        const totalLines = doc.splitTextToSize(item.total.toLocaleString("en-IN"), colW[6] - 2);

        const maxLines = Math.max(
            specLines.length,
            featureLines.length,
            priceLines.length,
            gstLines.length,
            gstAmtLines.length,
            totalLines.length
        );

        const rowHeight = Math.max(13, maxLines * 3.5 + 4);

        if(y + rowHeight > pageHeight - 25){
            addPageFooter(doc, pageWidth, pageHeight);
            doc.addPage();
            y = drawPDFHeader(doc, pageWidth, margin, logoData, logoFormat);
            drawTableHeader();
        }

        doc.setFont("helvetica", "normal");
        doc.setFontSize(7);
        doc.rect(margin, y, pageWidth - margin * 2, rowHeight);

        doc.text(String(index + 1), colX[0] + 1, y + 5);
        doc.text(specLines, colX[1] + 1, y + 4);
        doc.text(featureLines, colX[2] + 1, y + 4);
        doc.text(priceLines, colX[3] + 1, y + 5);
        doc.text(gstLines, colX[4] + 1, y + 5);
        doc.text(gstAmtLines, colX[5] + 1, y + 5);
        doc.text(totalLines, colX[6] + 1, y + 5);

        y += rowHeight;
    });

    /* =====================================================
       OPTIONAL ACCESSORIES TABLE
       Accessories are supplied free of cost; no Price/GST.
    ===================================================== */

    if(data.accessories.length > 0){

        if(y + 18 > pageHeight - 25){
            addPageFooter(doc, pageWidth, pageHeight);
            doc.addPage();
            y = drawPDFHeader(doc, pageWidth, margin, logoData, logoFormat);
        }

        y += 7;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.text("ACCESSORIES", margin, y);
        y += 5;

        const accHeaders = ["S.No", "Accessory", "Specification", "Qty.", "Remarks"];
        const accX = [margin, 25, 70, 140, 155];
        const accW = [10, 45, 70, 15, 35];

        function drawAccessoryTableHeader(){
            doc.setFillColor(235, 235, 235);
            doc.rect(margin, y, pageWidth - margin * 2, 8, "F");
            doc.setFont("helvetica", "bold");
            doc.setFontSize(7);
            accHeaders.forEach((h, i) => {
                doc.text(h, accX[i] + 1, y + 5);
            });
            y += 8;
        }

        drawAccessoryTableHeader();

        data.accessories.forEach((item, index) => {

            const nameLines = doc.splitTextToSize(item.name, accW[1] - 2);
            const specLines = doc.splitTextToSize(item.specification || "-", accW[2] - 2);
            const qtyLines = doc.splitTextToSize(String(item.qty), accW[3] - 2);
            const remarkLines = doc.splitTextToSize("Free of Cost", accW[4] - 2);

            const maxLines = Math.max(
                nameLines.length, specLines.length,
                qtyLines.length, remarkLines.length
            );

            const rowHeight = Math.max(12, maxLines * 3.5 + 4);

            if(y + rowHeight > pageHeight - 25){
                addPageFooter(doc, pageWidth, pageHeight);
                doc.addPage();
                y = drawPDFHeader(doc, pageWidth, margin, logoData, logoFormat);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.text("ACCESSORIES (CONT.)", margin, y);
                y += 5;
                drawAccessoryTableHeader();
            }

            doc.setFont("helvetica", "normal");
            doc.setFontSize(7);
            doc.rect(margin, y, pageWidth - margin * 2, rowHeight);

            doc.text(String(index + 1), accX[0] + 1, y + 5);
            doc.text(nameLines, accX[1] + 1, y + 4);
            doc.text(specLines, accX[2] + 1, y + 4);
            doc.text(qtyLines, accX[3] + 1, y + 5);
            doc.text(remarkLines, accX[4] + 1, y + 4);

            y += rowHeight;
        });
    }

    /* =====================================================
       TOTAL
    ===================================================== */

    if(y + 55 > pageHeight - 25){
        addPageFooter(doc, pageWidth, pageHeight);
        doc.addPage();
        y = drawPDFHeader(doc, pageWidth, margin, logoData, logoFormat);
    }

    y += 7;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.text(`Subtotal: ${moneyPDF(data.subtotal)}`, pageWidth - margin - 55, y);

    y += 6;
    doc.text(`GST: ${moneyPDF(data.gstTotal)}`, pageWidth - margin - 55, y);

    y += 7;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.line(pageWidth - margin - 65, y - 3, pageWidth - margin, y - 3);
    doc.text(`Grand Total: ${moneyPDF(data.grandTotal)}`, pageWidth - margin - 65, y + 5);

    y += 15;

    /* =====================================================
       SELECTED MACHINE DETAILS + TECHNICAL DETAILS
       Each selected machine is rendered in this order:
       1. Machine Name (centered)
       2. Machine Photo - 4 x 6 inch
       3. TECHNICAL DETAILS heading
       4. Basic details
       5. Full technical details
       Then the next selected machine starts.
    ===================================================== */

    for(const item of data.items){
        const d = item.technicalDetails || {};
        const configuration = Array.isArray(d.configuration) ? d.configuration : [];
        const constructionOptions = Array.isArray(d.constructionOptions) ? d.constructionOptions : [];
        const specifications = Array.isArray(d.specifications) ? d.specifications : [];
        const customization = Array.isArray(d.customization) ? d.customization : [];
        const changeParts = Array.isArray(d.changeParts) ? d.changeParts : [];
        const majorComponents = Array.isArray(d.majorComponents) ? d.majorComponents : [];
        const optionalEquipment = Array.isArray(d.optionalEquipment) ? d.optionalEquipment : [];

        addPageFooter(doc, pageWidth, pageHeight);
        doc.addPage();
        y = drawPDFHeader(doc, pageWidth, margin, logoData, logoFormat);

        /* ---------- MACHINE NAME ---------- */
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        const machineNameLines = doc.splitTextToSize(item.name || "Machine", pageWidth - margin * 2);
        doc.text(machineNameLines, pageWidth / 2, y, { align: "center" });
        y += machineNameLines.length * 5 + 6;

        /* ---------- MACHINE PHOTO: 6 x 6 INCH ---------- */
        // PDF units are mm. 6 x 6 inch = 101.6 x 152.4 mm.
        const photoWidth = 152.4;
        const photoHeight = 152.4;
        const photoX = (pageWidth - photoWidth) / 2;

        if(y + photoHeight + 25 > pageHeight - 20){
            addPageFooter(doc, pageWidth, pageHeight);
            doc.addPage();
            y = drawPDFHeader(doc, pageWidth, margin, logoData, logoFormat);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(13);
            doc.text(machineNameLines, pageWidth / 2, y, { align: "center" });
            y += machineNameLines.length * 5 + 6;
        }

        doc.rect(photoX, y, photoWidth, photoHeight);

        if(item.photoData){
            try {
                doc.addImage(
                    item.photoData,
                    item.photoFormat || "PNG",
                    photoX,
                    y,
                    photoWidth,
                    photoHeight
                );
            } catch(e){
                doc.setFont("helvetica", "normal");
                doc.setFontSize(9);
                doc.text("Machine Photo", pageWidth / 2, y + photoHeight / 2, { align: "center" });
            }
        } else {
            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            doc.text("Machine Photo", pageWidth / 2, y + photoHeight / 2, { align: "center" });
        }

        y += photoHeight + 10;

        /* ---------- TECHNICAL DETAILS ---------- */
        function pdfNewPage(){
            addPageFooter(doc, pageWidth, pageHeight);
            doc.addPage();
            y = drawPDFHeader(doc, pageWidth, margin, logoData, logoFormat);
        }

        function pdfSectionTitle(title){
            if(y > pageHeight - 28) pdfNewPage();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(9.5);
            doc.text(title, margin, y);
            y += 5;
        }

        function pdfParagraph(text){
            if(!text) return;
            const lines = doc.splitTextToSize(String(text), pageWidth - margin * 2);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(8.2);
            lines.forEach(line => {
                if(y > pageHeight - 20) pdfNewPage();
                doc.text(line, margin, y);
                y += 4.2;
            });
            y += 2;
        }

        function pdfList(title, items, ordered = false){
            if(!Array.isArray(items) || !items.length) return;
            pdfSectionTitle(title);
            items.forEach((x, i) => pdfParagraph(ordered ? `${i + 1}. ${x}` : `• ${x}`));
        }

        // Heading
        doc.setFont("helvetica", "bold");
        doc.setFontSize(12);
        doc.text("TECHNICAL DETAILS", pageWidth / 2, y, { align: "center" });
        y += 8;

        // Basic machine details
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8.5);
        doc.text(`Specification: ${item.specification || "-"}`, margin, y);
        y += 4.5;
        doc.text(`Feature / Capacity : ${item.feature || "-"}`, margin, y);
        y += 4.5;
        if(item.category !== "Laboratory Equipment"){
        doc.text(`Power: ${item.power || "--"}`, margin, y);
         y += 4.5;
        doc.text(`Warranty: ${item.warranty || "--"}`, margin, y);
         y += 7;
        } else {
            y += 7;
        }

        /* ---------- FULL TECHNICAL DETAILS ---------- */
        if(d.constructionDetails){
            pdfSectionTitle("Construction Details");
            pdfParagraph(d.constructionDetails);
        }

        pdfList("Machine Configuration", configuration, true);
        pdfList("Construction Options", constructionOptions, false);

        if(d.operation){
            pdfSectionTitle("Operation");
            pdfParagraph(d.operation);
        }

        if(specifications.length){
            pdfSectionTitle("Technical Specifications");

            if(y + 20 > pageHeight - 20) pdfNewPage();

            const tx = [margin, 75];
            const tw = [60, pageWidth - margin * 2 - 60];

            function drawSpecificationHeader(){
                doc.setFillColor(235, 235, 235);
                doc.rect(margin, y, pageWidth - margin * 2, 7, "F");
                doc.setFont("helvetica", "bold");
                doc.setFontSize(7.5);
                doc.text("Parameter", margin + 1, y + 4.5);
                doc.text("Details", tx[1] + 1, y + 4.5);
                y += 7;
            }

            drawSpecificationHeader();

            specifications.forEach(row => {
                const parameter = Array.isArray(row) ? String(row[0] ?? "") : "";
                const value = Array.isArray(row) ? String(row[1] ?? "") : "";
                const pLines = doc.splitTextToSize(parameter, tw[0] - 2);
                const vLines = doc.splitTextToSize(value, tw[1] - 2);
                const rh = Math.max(9, Math.max(pLines.length, vLines.length) * 3.7 + 3);

                if(y + rh > pageHeight - 20){
                    pdfNewPage();
                    drawSpecificationHeader();
                }

                doc.setFont("helvetica", "normal");
                doc.setFontSize(7.5);
                doc.rect(margin, y, pageWidth - margin * 2, rh);
                doc.text(pLines, tx[0] + 1, y + 4);
                doc.text(vLines, tx[1] + 1, y + 4);
                y += rh;
            });
        }

        pdfList("Customization", customization, true);
        pdfList("Change Parts", changeParts, false);
        pdfList("Major Components", majorComponents, false);
        pdfList("Optional Equipment", optionalEquipment, false);

        if(d.hygienicFeatures){
            pdfSectionTitle("Hygienic Features");
            pdfParagraph(d.hygienicFeatures);
        }

        if(d.specialFeature){
            pdfSectionTitle("Special Feature");
            pdfParagraph(d.specialFeature);
        }

        if(d.note){
            pdfSectionTitle("Note");
            pdfParagraph(d.note);
        }
    }

    /* =====================================================
       TERMS & CONDITIONS
       FIX: this whole block was previously wrapped inside an
       unclosed /* comment and never rendered. Now active.
    ===================================================== */

    if(y + 35 > pageHeight - 25){
        addPageFooter(doc, pageWidth, pageHeight);
        doc.addPage();
        y = drawPDFHeader(doc, pageWidth, margin, logoData, logoFormat);
    }

    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text("Terms & Conditions", margin, y);

    y += 6;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);

    const termLines = doc.splitTextToSize(data.terms, pageWidth - margin * 2);

    termLines.forEach(line => {

        if(y > pageHeight - 22){
            addPageFooter(doc, pageWidth, pageHeight);
            doc.addPage();
            y = drawPDFHeader(doc, pageWidth, margin, logoData, logoFormat);
        }

        doc.text(line, margin, y);
        y += 4.5;
    });

    addPageFooter(doc, pageWidth, pageHeight);

    /* =====================================================
       PAGE NUMBERS
    ===================================================== */

    const pages = doc.internal.getNumberOfPages();

    for(let i = 1; i <= pages; i++){
        doc.setPage(i);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(120, 120, 120);
        doc.text(`Page ${i} of ${pages}`, pageWidth - margin, pageHeight - 8, { align: "right" });
        doc.setTextColor(0, 0, 0);
    }

  doc.save(`Quotation_${data.customer.replace(/[^a-z0-9\-_]+/gi, "_").replace(/^_+|_+$/g, "") || "Customer"}.pdf`);
  const safeCustomerName =
    data.customer.replace(/[^a-z0-9\-_]+/gi, "_")
    .replace(/^_+|_+$/g, "") || "Customer";

    const fileName = `Quotation_${safeCustomerName}.pdf`;

if (window.logQuotation) {
    window.logQuotation(
        data,
        quotationNo,
        fileName
    ).catch(error => {
        console.error("Quotation tracking failed:", error);
    });
}
}

/* =====================================================
