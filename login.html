<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARATEC ENGINEERING - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 15px;
        }

        h1 {
            margin: 5px 0;
            font-size: 24px;
            color: #222;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #1f5eff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #174dcc;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <img src="saratec logo.png" class="logo" alt="SARATEC ENGINEERING">

    <h1>SARATEC ENGINEERING</h1>
    <div class="subtitle">Quotation System</div>

    <input
        type="email"
        id="email"
        placeholder="Enter Email"
        autocomplete="username"
    >

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        autocomplete="current-password"
    >

    <button id="loginBtn">LOGIN</button>

    <div id="message"></div>

</div>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDeeMQploVOBrMyaVWQLUIgwQyVQ60ZfB0",
        authDomain: "saratec-quotation.firebaseapp.com",
        projectId: "saratec-quotation",
        storageBucket: "saratec-quotation.firebasestorage.app",
        messagingSenderId: "856410846697",
        appId: "1:856410846697:web:aa491f55abe772e006c778",
        measurementId: "G-KCK7D501KT"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // Login button
    document.getElementById("loginBtn").addEventListener("click", async () => {

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");
        const button = document.getElementById("loginBtn");

        if (!email || !password) {
            message.style.color = "red";
            message.textContent = "Please enter email and password.";
            return;
        }

        button.disabled = true;
        button.textContent = "LOGGING IN...";
        message.textContent = "";

        try {

            await signInWithEmailAndPassword(auth, email, password);

            message.style.color = "green";
            message.textContent = "Login successful!";

            // Open quotation system
            setTimeout(() => {
                window.location.href = "saratecqqq.html";
            }, 500);

        } catch (error) {

            console.error(error);

            message.style.color = "red";

            if (
                error.code === "auth/invalid-credential" ||
                error.code === "auth/invalid-login-credentials"
            ) {
                message.textContent = "Invalid email or password.";
            }
            else if (error.code === "auth/too-many-requests") {
                message.textContent = "Too many attempts. Please try again later.";
            }
            else {
                message.textContent = "Login failed. Please try again.";
            }

            button.disabled = false;
            button.textContent = "LOGIN";
        }

    });

</script>

</body>
</html>
